name: PyPI Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Bump .bumpversion.cfg, commit, push a v* tag, then publish."
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump_version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bumpversion
        run: |
          python -m pip install --upgrade pip
          pip install bumpversion

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and push v* tag
        id: bump
        run: |
          bumpversion ${{ inputs.version_bump }}
          git push origin "HEAD:${{ github.ref_name }}" --tags
          TAG=$(git describe --tags --exact-match)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  pypi_publish:
    needs: [bump_version]
    if: >
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && needs.bump_version.result == 'success')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version tag
        id: release
        run: |
          if [ -n "${{ needs.bump_version.outputs.tag }}" ]; then
            TAG="${{ needs.bump_version.outputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          TAG="${TAG#v}"
          VERSION=$(python -c "from configparser import ConfigParser; cfg=ConfigParser(); cfg.read('.bumpversion.cfg'); print(cfg['bumpversion']['current_version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ${{ steps.release.outputs.tag }} does not match .bumpversion.cfg version ${VERSION}"
            exit 1
          fi

      - name: Clean build artifacts
        run: rm -rf dist build *.egg-info

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install setuptools wheel twine build

      - name: Run tests
        run: python -m pytest

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" dist/* \
            --title "FEZrs ${{ steps.release.outputs.tag }}" \
            --generate-notes \
            --verify-tag

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
