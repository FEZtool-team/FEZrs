{% set version = environ.get('FEZRS_VERSION', '1.2.0') %}

package:
  name: fezrs
  version: "{{ version }}"

source:
  url: https://pypi.io/packages/source/f/fezrs/fezrs-{{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir"

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - opencv
  # Must cover everything `import fezrs` loads. Previously this listed fastapi,
  # which the package does not use, while omitting pandas, rasterio, pillow and
  # imagecodecs, all of which are imported at package import time - so a conda
  # install failed on `import fezrs` with ModuleNotFoundError: rasterio.
  run:
    - python >=3.11
    - numpy
    - pillow
    - pandas
    - rasterio
    - matplotlib
    - imagecodecs
    - scikit-learn
    - scikit-image
    - opencv


# test:
#   imports:
#     - fezrs
  # skip tests temporarily because of missing libEGL dependency

about:
  home: https://feztool.com/fezrs/
  doc_url: https://feztool-team.github.io/FEZdocs/libraries/fezrs/
  dev_url: https://github.com/FEZtool-team/FEZrs
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: "Open-source Python package for geospatial multispectral image processing and remote sensing: spectral indices, filters, image enhancement, change detection and classification."

extra:
  recipe-maintainers:
    - FEZtool-team
